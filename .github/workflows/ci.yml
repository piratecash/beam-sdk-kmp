name: CI

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: beam-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x64
            triple: x86_64-unknown-linux-gnu
            binary: libbeam_sdk_kmp.so
          - os: windows-2022
            artifact: windows-x64
            triple: x86_64-pc-windows-msvc
            binary: beam_sdk_kmp.dll
          - os: macos-15
            artifact: macos-arm64
            triple: aarch64-apple-darwin
            binary: libbeam_sdk_kmp.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Fetch pinned host dependencies
        shell: bash
        run: ./scripts/fetch-host-dependencies.sh
      - name: Build instrumented native library
        shell: bash
        run: |
          ./scripts/fetch-beam-core.sh
          BEAM_NATIVE_BUILD_DIR=.native-cache/build-host-tests BEAM_NATIVE_TESTS=1 ./scripts/build-native-host.sh
      - name: Test host JNI and Kotlin SDK
        shell: bash
        env:
          BEAM_EXPECT_NATIVE_TEST_FIXTURES: "1"
        run: ./gradlew :beam-sdk:desktopTest :sample-shared:desktopTest --console=plain
      - name: Build production native library
        shell: bash
        run: BEAM_NATIVE_BUILD_DIR=.native-cache/build-host-release ./scripts/build-native-host.sh
      - name: Verify host artifact
        shell: bash
        run: |
          binary="beam-sdk/prebuilt/desktop/native/${{ matrix.triple }}/${{ matrix.binary }}"
          test -s "$binary"
          file "$binary"
          strings_file="$(mktemp)"
          trap 'rm -f "$strings_file"' EXIT
          if ! strings "$binary" > "$strings_file"; then
            echo "Unable to inspect native binary strings: $binary" >&2
            exit 1
          fi
          for private_root in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
            if grep -F "$private_root" "$strings_file" >/dev/null; then
              echo "Native binary contains private build path: $private_root" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.artifact }}
          path: beam-sdk/prebuilt/desktop/native
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned NDK
        run: sdkmanager "ndk;27.0.12077973"
      - name: Build Android native matrix
        shell: bash
        run: |
          ./scripts/fetch-beam-core.sh
          ./scripts/fetch-android-dependencies.sh
          ./scripts/build-native-android.sh
          "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded \
            beam-sdk/prebuilt/android/native/arm64-v8a/libbeam_sdk_kmp.so \
            beam-sdk/prebuilt/android/native/armeabi-v7a/libbeam_sdk_kmp.so
      - name: Verify Android ELF matrix
        shell: bash
        run: |
          readelf_bin="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a armeabi-v7a; do
            binary="beam-sdk/prebuilt/android/native/$abi/libbeam_sdk_kmp.so"
            test -s "$binary"
            "$readelf_bin" -d "$binary" | grep -q 'libc.so'
            ! "$readelf_bin" -d "$binary" | grep -Eq 'lib(ssl|crypto|c\+\+)_shared.so'
            "$readelf_bin" -l "$binary" | awk \
              '/ LOAD / { found=1; if ($NF != "0x4000") bad=1 } END { exit (bad || !found) }'
          done
      - name: Build consumable AAR and sample APK
        run: ./gradlew :beam-sdk:publishToMavenLocal :sample-android:assembleDebug --console=plain
      - name: Verify both ABIs are packaged
        shell: bash
        run: |
          unzip -l beam-sdk/build/outputs/aar/beam-sdk.aar | grep -q 'jni/arm64-v8a/libbeam_sdk_kmp.so'
          unzip -l beam-sdk/build/outputs/aar/beam-sdk.aar | grep -q 'jni/armeabi-v7a/libbeam_sdk_kmp.so'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-android
          path: beam-sdk/prebuilt/android/native
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-aar
          path: beam-sdk/build/outputs/aar/beam-sdk.aar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require device release evidence
        run: ./scripts/verify-release-evidence.sh "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: native-artifacts
      - name: Create deterministic native archives
        shell: bash
        run: |
          set -eu
          for artifact in linux-x64 macos-arm64 windows-x64 android; do
            source="native-artifacts/native-$artifact"
            test -d "$source"
            tar --sort=name --mtime='UTC 1980-02-01' --owner=0 --group=0 --numeric-owner \
              -czf "native-$artifact.tar.gz" -C "$source" .
          done
          sha256sum native-*.tar.gz | sort > natives.sha256
      - name: Publish validated assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" \
              --notes "Beam SDK KMP native libraries."
          gh release upload "${{ github.ref_name }}" native-*.tar.gz natives.sha256 --clobber
          gh release edit "${{ github.ref_name }}" --draft=false
